<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="images\Leaning_Left.png">
<title>B-V2 Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <strong>B-V2 Terminal</strong>
  <span id="conn">Disconnected</span>
</header>

<main>

  <section id="camera" class="panel">
    <h2>Camera</h2>
    <div class="feed">
      <!-- Replace with your stream, e.g. <img src="http://ROBOT_IP:8080/stream"> -->
      <span>No signal</span>
    </div>
  </section>

  <section id="status" class="panel">
    <h2>Status</h2>
    <div>Mode: <span>--</span></div>
    <div>Uptime: <span>--</span></div>
    <div>Fault: <span>None</span></div>
    <div class="row">
      <button>Enable</button>
      <button>E-Stop</button>
    </div>
  </section>

  <section id="drive" class="panel">
    <h2>Drive</h2>
    <div class="row">
      <button>Fwd</button>
      <button>Back</button>
      <button>Left</button>
      <button>Right</button>
    </div>
    <label>Speed <input type="range" min="0" max="100" value="50"></label>
  </section>

  <section id="attitude" class="panel">
    <h2>Attitude</h2>
    <div>Pitch: <span>--</span>°</div>
    <div>Roll: <span>--</span>°</div>
    <div>Yaw: <span>--</span>°</div>
  </section>

  <section id="pid" class="panel">
    <h2>PID Tuning</h2>
    <label>Kp <input type="number" step="0.01" value="0"></label>
    <label>Ki <input type="number" step="0.01" value="0"></label>
    <label>Kd <input type="number" step="0.01" value="0"></label>
    <button>Apply</button>
  </section>

  <section id="power" class="panel">
    <h2>Power</h2>
    <div>Battery: <span>--</span> V</div>
    <div>Current: <span>--</span> A</div>
    <div>Motor temp: <span>--</span> °C</div>
  </section>

  <section id="log" class="panel">
    <h2>Log</h2>
    <div>Waiting for data...</div>
  </section>

</main>

</body>
</html>
